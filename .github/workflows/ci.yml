# CI (slice R1, #32): build both implementations, run the conformance suite against each build, and the offline
# smoke checks. Spends nothing and uses no secrets: no claude session is started, the paid live suite
# (smoke/run.sh) is on demand only and is not run here.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  rust:
    name: Rust build, unit tests and conformance suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the Rust toolchain pinned in impl/rust/rust-toolchain.toml
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' impl/rust/rust-toolchain.toml)
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
          echo "RUST_CHANNEL=$channel" >> "$GITHUB_ENV"

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            impl/rust/target
          key: cargo-${{ runner.os }}-${{ env.RUST_CHANNEL }}-${{ hashFiles('impl/rust/Cargo.lock', 'impl/rust/Cargo.toml', 'impl/rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.RUST_CHANNEL }}-

      - name: Format
        working-directory: impl/rust
        run: cargo fmt --check

      - name: Clippy
        working-directory: impl/rust
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        working-directory: impl/rust
        run: cargo test --locked

      - name: Build release binary
        working-directory: impl/rust
        run: cargo build --release --locked

      - name: Conformance suite against register-rs
        run: python3 -I conformance/run.py -- impl/rust/target/release/register-rs

      - name: Stdout drain at EOF against register-rs (issue #102)
        run: python3 -I conformance/check_stdout_drain.py -- impl/rust/target/release/register-rs

      - name: Keep the binary for the offline checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: register-rs
          path: impl/rust/target/release/register-rs
          if-no-files-found: error
          retention-days: 1

  typescript:
    name: TypeScript build, unit tests and conformance suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (version from impl/ts/.nvmrc), with the npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: impl/ts/.nvmrc
          cache: npm
          cache-dependency-path: impl/ts/package-lock.json

      - name: Install dependencies from the lockfile
        working-directory: impl/ts
        run: npm ci

      - name: Lint
        working-directory: impl/ts
        run: npm run lint

      - name: Typecheck
        working-directory: impl/ts
        run: npm run typecheck

      - name: Unit tests
        working-directory: impl/ts
        run: npm test

      - name: Build the bundle
        working-directory: impl/ts
        run: npm run build

      - name: Conformance suite against register.mjs
        run: python3 -I conformance/run.py -- node impl/ts/dist/register.mjs

      - name: Stdout drain at EOF, and the bounded stalled-reader drain, against register.mjs (issue #102)
        run: python3 -I conformance/check_stdout_drain.py --expect-bounded-drain -- node impl/ts/dist/register.mjs

      - name: Keep the bundle for the offline checks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: register-ts
          path: impl/ts/dist/register.mjs
          if-no-files-found: error
          retention-days: 1

  offline-checks:
    name: Contract, launcher and offline smoke checks
    needs: [rust, typescript]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node (the TypeScript build is run by the launcher and the fixtures check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: impl/ts/.nvmrc

      - name: Fetch the Rust binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: register-rs
          path: impl/rust/target/release

      - name: Fetch the TypeScript bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: register-ts
          path: impl/ts/dist

      - name: Restore the executable bit (artefacts do not keep file modes)
        run: chmod 755 impl/rust/target/release/register-rs

      - name: Contract checks
        run: |
          python3 --version
          python3 -I contract/check_contract.py
          python3 -I contract/check_lifecycle_events.py
          python3 -I conformance/run.py --validate
          python3 -I conformance/selftest.py

      - name: Launcher and plugin checks (both builds reached through the launcher)
        env:
          REGISTER_RS_DIR: ${{ github.workspace }}/impl/rust/target/release
        run: python3 -I conformance/check_launcher.py

      - name: Launcher scenarios S-73a and S-73b
        env:
          REGISTER_RS_DIR: ${{ github.workspace }}/impl/rust/target/release
        run: PATH="$REGISTER_RS_DIR:$PATH" python3 -I conformance/run.py --only 'S-73*' -- true

      - name: Offline smoke fixtures on both builds (no claude session, no spend)
        run: python3 -I smoke/check_fixtures.py
